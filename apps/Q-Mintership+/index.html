<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Q-Apps+ theme boot (shared/hub-theme/boot-inline.js): paints the
         saved theme's background before React loads. STORAGE_KEY and HUB20
         match src/theme/qplus-theme.ts. */
      (function () {
        var STORAGE_KEY = '%QMP_THEME_STORAGE_KEY%';
        var HUB20 = { light: '#eef4f4', dark: '#07090b' };
        var BOOT = {"hub30":{"light":"#EEE7DC","dark":"#0E0F14"},"black":{"light":"#000000","dark":"#000000"},"white":{"light":"#ffffff","dark":"#ffffff"}};
        // Hub's light/dark: the URL's theme (remembered), else the remembered one (a
        // reload after in-app navigation has no theme, and Core then injects
        // "light"), else the injected one, else dark. Same order as boot.ts.
        var HOST_MODE_KEY = 'qplus-hub-mode';
        var fromUrl = new URLSearchParams(location.search).get('theme');
        var remembered = null;
        try {
          remembered = localStorage.getItem(HOST_MODE_KEY);
          if (fromUrl === 'light' || fromUrl === 'dark') localStorage.setItem(HOST_MODE_KEY, fromUrl);
        } catch (e) {}
        var mode =
          fromUrl === 'light' || fromUrl === 'dark'
            ? fromUrl
            : remembered === 'light' || remembered === 'dark'
              ? remembered
              : window._qdnTheme;
        if (mode !== 'light' && mode !== 'dark') mode = 'dark';
        var ui = 'hub30';
        try {
          var stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (stored === 'hub20' || BOOT.hasOwnProperty(stored)) ui = stored;
        } catch (e) {}
        var shown = ui === 'black' ? 'dark' : ui === 'white' ? 'light' : mode;
        var bg = ui === 'hub20' ? HUB20[mode] : BOOT[ui][mode];
        var root = document.documentElement;
        root.setAttribute('data-theme', shown);
        root.setAttribute('data-ui-theme', ui);
        root.style.colorScheme = shown;
        root.style.background = bg;
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.background = bg;
        });
      })();
    </script>
    <script>
      /* Hub serves the app under /render/APP/<its name>/…; a <base> keeps
         relative asset URLs and client routes working there (docs/QORTAL.md). */
      (function () {
        var match = location.pathname.match(/^\/render\/(?:APP|WEBSITE)\/[^/]+/i);
        var base = (window._qdnBase || (match && match[0]) || '').replace(/\/$/, '');
        if (base) {
          var tag = document.createElement('base');
          tag.href = base + '/';
          document.head.insertBefore(tag, document.head.firstChild);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%QMP_APP_NAME%: nominations, Minter Admin decisions and the history of Qortal's MINTER group" />
    <title>%QMP_APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
